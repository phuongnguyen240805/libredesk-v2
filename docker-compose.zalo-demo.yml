services:
  app:
    image: libredesk-zalo-demo:local
    build:
      context: .
      dockerfile: Dockerfile.source-demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  zalo-connector:
    image: libredesk-zalo-connector:local
    build:
      context: ./services/zalo-connector
      dockerfile: Dockerfile
    container_name: libredesk_zalo_connector
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      DATA_DIR: /app/data
      ZALO_ACCOUNT_ID: ${ZALO_ACCOUNT_ID:-demo-zalo}
      CUSTOMER_CARE_TENANT_ID: ${CUSTOMER_CARE_TENANT_ID:-1}
      CONNECTOR_TOKEN: ${ZALO_CONNECTOR_TOKEN:?Set ZALO_CONNECTOR_TOKEN in .env}
      CUSTOMER_CARE_WEBHOOK_URL: ${CUSTOMER_CARE_WEBHOOK_URL:-http://host.docker.internal:7002/api/internal/customer-care}
      CUSTOMER_CARE_WEBHOOK_SECRET: ${CUSTOMER_CARE_WEBHOOK_SECRET:?Set CUSTOMER_CARE_WEBHOOK_SECRET in .env}
      INBOUND_RETRY_COUNT: 5
      INBOUND_RETRY_BASE_MS: 1000
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - libredesk
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./zalo-data:/app/data
    depends_on:
      - app

  facebook-connector:
    image: libredesk-facebook-connector:local
    build:
      context: ..
      dockerfile: libredesk/services/facebook-connector/Dockerfile
    container_name: libredesk_facebook_connector
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3200
      DATA_DIR: /app/data
      FACEBOOK_ACCOUNT_ID: ${FACEBOOK_ACCOUNT_ID:-demo-facebook}
      CUSTOMER_CARE_TENANT_ID: ${CUSTOMER_CARE_TENANT_ID:-1}
      CONNECTOR_TOKEN: ${FACEBOOK_CONNECTOR_TOKEN:-${ZALO_CONNECTOR_TOKEN}}
      CUSTOMER_CARE_WEBHOOK_URL: ${CUSTOMER_CARE_FACEBOOK_WEBHOOK_URL:-http://host.docker.internal:7002/api/internal/customer-care}
      CUSTOMER_CARE_WEBHOOK_SECRET: ${CUSTOMER_CARE_WEBHOOK_SECRET:?Set CUSTOMER_CARE_WEBHOOK_SECRET in .env}
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - libredesk
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./facebook-data:/app/data
    depends_on:
      - app
